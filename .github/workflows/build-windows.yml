name: Build Windows preview

# Builds and signs the private product's Windows preview installer (a per-user
# x64 NSIS installer, Rust engine only) on this public repository's free
# windows-latest runner.
#
# Triggers: workflow_dispatch only. Never pull_request or push. Linux gates
# (product-ci.yml) run first, as build-dmg.yml does.
#
# The signing certificate is ONE stable self-signed development certificate
# whose private key and password live only as secrets of the
# windows-preview-signing environment. They are passed only to the build step,
# never as job-level env. Only the public .cer is ever published.
# DMG_SOURCE_TOKEN is read-only and goes only to checkout-product.
#
# Private source is checked out sparsely (same exclusions as build-dmg.yml).
# Every command's output goes to a log under RUNNER_TEMP that is never printed,
# uploaded or cached; step output is fixed labels, statuses and counts. The
# only artifact is the installer plus its sha256, retained for 1 day.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Product commit (full 40-character SHA)"
        required: true
        type: string
      version:
        description: "Desktop version (X.Y.Z, no leading v)"
        required: true
        type: string
      skip_linux_gates:
        description: "Skip the Linux gates (a preview build while the product's Linux suite is red); never for a release"
        required: false
        default: false
        type: boolean

run-name: Build Windows preview ${{ inputs.version }} ${{ inputs.ref }}

permissions:
  contents: read

concurrency:
  group: build-windows-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate payload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate ref and version
        id: resolve
        env:
          IN_REF: ${{ inputs.ref }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, ".github/scripts/build-dmg")
          from payload import parse_inputs
          payload = parse_inputs(os.environ["IN_REF"], os.environ["IN_VERSION"], "adhoc")["client_payload"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"ref={payload['ref']}\n")
              out.write(f"version={payload['version']}\n")
          print(f"payload: ok {payload['version']}")
          PY

  linux-green:
    name: Linux gates
    needs: validate
    if: ${{ !inputs.skip_linux_gates }}
    uses: ./.github/workflows/product-ci.yml
    with:
      ref: ${{ needs.validate.outputs.ref }}
      caller: build-windows
    secrets:
      DMG_SOURCE_TOKEN: ${{ secrets.DMG_SOURCE_TOKEN }}

  build-windows:
    name: Windows build
    needs: [validate, linux-green]
    # The gates may be skipped on request (skip_linux_gates), never failed.
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.linux-green.result == 'success' || needs.linux-green.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 120
    environment: windows-preview-signing
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/checkout-product
        with:
          ref: ${{ needs.validate.outputs.ref }}
          token: ${{ secrets.DMG_SOURCE_TOKEN }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install the product's pinned Rust toolchain
        run: |
          set -euo pipefail
          test -f product/engine/rust/rust-toolchain.toml
          (cd product/engine/rust && rustup toolchain install)
          echo "build-windows: toolchain: ready"

      - name: Install the desktop package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-windows"
          cd product/desktop
          if ! python3 ../../.github/scripts/build-dmg/timed_run.py \
            --label "desktop install" \
            --timeout-minutes 10 \
            --log "$RUNNER_TEMP/build-windows/install.log" \
            -- pnpm install --frozen-lockfile --ignore-scripts; then
            echo "pnpm install in product/desktop failed. Run it in a local checkout of the same ref to see why."
            exit 1
          fi

      - name: Build and sign the installer (output withheld)
        env:
          CSC_LINK: ${{ secrets.WINDOWS_PREVIEW_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_PREVIEW_CERT_PASSWORD }}
          BUILD_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set +x
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" || -z "${CSC_KEY_PASSWORD:-}" ]]; then
            echo "the windows-preview-signing secrets are not configured"
            exit 1
          fi
          cd product/desktop
          if ! python3 ../../.github/scripts/build-dmg/timed_run.py \
            --label "package:win" \
            --timeout-minutes 100 \
            --log "$RUNNER_TEMP/build-windows/build.log" \
            -- pnpm package:win; then
            # package-win.mjs's own fixed lines ("package-win: <step> failed (exit N)"): labels and
            # an exit code, the build task's own top-level Error sentence and cargo's summary lines (which name a crate or a missing tool), never compiler diagnostics, so they name the failing step safely.
            grep -E '^(package-win: [A-Za-z :-]+( failed \(exit [0-9a-z]+\))?|Error: |error: (could not compile|failed to|linker|no matching package|the lock file)|Caused by:)' "$RUNNER_TEMP/build-windows/build.log" | cut -c1-200 | head -n 12 || true
            echo "package:win failed. Run it in a local checkout of the same ref to see why."
            exit 1
          fi
          echo "build-windows: installer: built"

      - name: Stage the installer and its checksum
        env:
          EXPECT_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib, os, shutil
          from pathlib import Path
          src = Path("product/desktop/release")
          found = sorted(src.glob("*.exe"))
          if len(found) != 1:
              raise SystemExit(f"expected one installer, found {len(found)}")
          exe = found[0]
          if os.environ["EXPECT_VERSION"] not in exe.name:
              raise SystemExit("installer name does not carry the requested version")
          digest = hashlib.sha256(exe.read_bytes()).hexdigest()
          shutil.copy2(exe, Path("dist") / exe.name)
          Path("dist", exe.name + ".sha256").write_text(f"{digest}  {exe.name}\n")
          print(f"staged {exe.name} ({exe.stat().st_size} bytes)")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blowhorn-windows-preview
          path: dist/
          retention-days: 1

  smoke-windows:
    name: Windows smoke
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blowhorn-windows-preview
          path: dist/

      # Output is a label and ok or failed per check, never the product's own output.
      - name: Install, run the engine, uninstall
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(dist/*.exe)
          [[ ${#installers[@]} -eq 1 ]] || { echo "expected one installer, found ${#installers[@]}"; exit 1; }
          python3 .github/scripts/build-windows/smoke.py "${installers[0]}"
