name: Windows MSIX lab

# The #2776 spike's questions 2 and 4, on a free windows-latest runner: install the MSIX that a
# build-windows run (target appx) produced, start the packaged app, and see (2) whether the app's
# native host registration reaches the real HKEY_CURRENT_USER or stays inside the package, and (4)
# where its files land. Dispatch-only; reads a run's artifact of this repository (actions: read);
# no secrets, no private checkout. The package is signed with the public preview certificate, which
# is trusted for the job from the package's own signature. Output is fixed labels only.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "The build-windows run (target appx) whose artifact to install"
        required: true
        type: string

run-name: Windows MSIX lab ${{ inputs.run_id }}

permissions:
  contents: read
  actions: read

jobs:
  lab:
    name: MSIX lab
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the appx artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in
            ''|*[!0-9]*) echo "run_id must be digits"; exit 1 ;;
          esac
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name blowhorn-windows-preview --dir dist
          shopt -s nullglob
          packages=(dist/*.appx)
          test "${#packages[@]}" -eq 1
          echo "msix: artifact downloaded"

      - name: Install the package and start the packaged app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = (Get-ChildItem dist -Filter *.appx | Select-Object -First 1).FullName
          function Say($label, $ok, $why = "") { if ($ok) { Write-Host "msix: ${label}: ok" } else { Write-Host "msix: ${label}: failed ($why)" } }

          # Trust the package's own signer for this job (a throwaway runner, never a person's machine).
          $signature = Get-AuthenticodeSignature $package
          Say "package signed" ($signature.SignerCertificate -ne $null) "$($signature.Status)"
          $cer = Join-Path $env:RUNNER_TEMP "signer.cer"
          Export-Certificate -Cert $signature.SignerCertificate -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null

          try {
            Add-AppxPackage -Path $package
            Say "package installed" $true
          } catch {
            Say "package installed" $false $_.Exception.GetType().Name
            exit 1
          }
          $installed = Get-AppxPackage -Name "Layer5.Blowhorn"
          $family = $installed.PackageFamilyName
          Say "package found" ($installed -ne $null)
          $engine = Get-ChildItem -Path $installed.InstallLocation -Recurse -Filter blowhorn.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*\engine\bin\*" } | Select-Object -First 1
          Say "engine in the package" ($engine -ne $null)
          Say "extension folder in the package" ((Get-ChildItem -Path $installed.InstallLocation -Recurse -Filter manifest.json -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*\engine\extension\*" } | Select-Object -First 1) -ne $null)

          # What the installed package's own manifest says (not what the build was asked for).
          $manifest = Get-AppxPackageManifest $installed
          $text = $manifest.OuterXml
          Say "manifest disables registry virtualization" ($text -match "RegistryWriteVirtualization>disabled")
          Say "manifest disables file virtualization" ($text -match "FileSystemWriteVirtualization>disabled")
          Say "manifest holds unvirtualizedResources" ($text -match "unvirtualizedResources")

          # A probe run inside the package's identity, apart from the app: it writes one registry value
          # and one file, and the job then looks for each outside the package. This tells what the
          # manifest's virtualization settings do on their own.
          $probeKey = "HKCU:\Software\BlowhornMsixProbe"
          $probeFile = Join-Path $env:LOCALAPPDATA "BlowhornMsixProbe.txt"
          Remove-Item $probeKey, $probeFile -ErrorAction SilentlyContinue
          try {
            Invoke-CommandInDesktopPackage -PackageFamilyName $family -AppId Blowhorn -PreventBreakaway -Command "cmd.exe" -Args '/c reg add HKCU\Software\BlowhornMsixProbe /v probe /d 1 /f && echo probe> "%LOCALAPPDATA%\BlowhornMsixProbe.txt"'
            Say "probe ran in the package" $true
          } catch {
            Say "probe ran in the package" $false $_.Exception.GetType().Name
          }
          Start-Sleep -Seconds 10
          Say "probe registry value in the real HKCU" (Test-Path $probeKey)
          Say "probe file in the real profile" (Test-Path $probeFile)
          Say "probe file in the package's private cache" (Test-Path (Join-Path $env:LOCALAPPDATA "Packages\$family\LocalCache\Local\BlowhornMsixProbe.txt"))
          Remove-Item $probeKey, $probeFile -ErrorAction SilentlyContinue

          $key = "HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.blowhorn.chrome_extension"
          Remove-Item $key -ErrorAction SilentlyContinue

          # The engine's own host registration, run inside the package identity apart from the app, with
          # its one-line answer kept in a file outside the package to read the verdict from.
          $out = Join-Path $env:RUNNER_TEMP "registration.out"
          Remove-Item $out -ErrorAction SilentlyContinue
          try {
            Invoke-CommandInDesktopPackage -PackageFamilyName $family -AppId Blowhorn -PreventBreakaway -Command "cmd.exe" -Args "/c `"`"$($engine.FullName)`" chrome extension-install --json > `"$out`" 2>&1`""
          } catch { Say "registration command started" $false $_.Exception.GetType().Name }
          for ($i = 0; $i -lt 20 -and -not (Test-Path $key); $i++) { Start-Sleep -Seconds 2 }
          Say "engine registration reached the real HKCU" (Test-Path $key)
          if (Test-Path $out) {
            $answer = (Get-Content $out -Raw)
            $ok = $answer -match '"ok":\s*true'
            Say "engine registration answered ok" $ok
            if (-not $ok) {
              $line = ($answer -split "`n" | Where-Object { $_ -match "^The native host was not registered: [A-Za-z0-9 ,.'():_\\/-]{1,200}$|\"error\": \"[A-Za-z0-9 ,.'():_\\/-]{1,200}\"" } | Select-Object -First 1)
              if ($line) { Write-Host "msix: registration said: $line" }
            }
          } else { Say "engine registration answered ok" $false "no output file" }
          Remove-Item $key -ErrorAction SilentlyContinue

          # Start the packaged app by its application id (Blowhorn): the app registers the host after
          # it has resolved its engine, about twenty seconds in.
          Start-Process "shell:AppsFolder\$family!Blowhorn"
          $real = $false
          for ($i = 0; $i -lt 60 -and -not $real; $i++) { Start-Sleep -Seconds 3; $real = Test-Path $key }
          Say "host registration reached the real HKCU" $real "virtualized or not reached"

          # Where a file the app wrote under its own profile landed: the real %LOCALAPPDATA%\Blowhorn, or
          # the package's private LocalCache.
          $realFolder = Test-Path (Join-Path $env:LOCALAPPDATA "Blowhorn")
          $private = Test-Path (Join-Path $env:LOCALAPPDATA "Packages\$family\LocalCache\Local\Blowhorn")
          Say "manifest folder in the real profile" $realFolder
          Say "manifest folder in the package's private cache" $private

          Get-Process -Name Blowhorn -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item $key -ErrorAction SilentlyContinue
          Remove-AppxPackage -Package $installed.PackageFullName
          Write-Host "msix: done"
